# Use postgres/example user/password credentials
version: '3.1'

services:
  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: my_super_secret
      POSTGRES_USER: ships
